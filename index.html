<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070A0F">
  <title>BTV News Studio | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="particle particle-one"></span>
    <span class="particle particle-two"></span>
    <span class="particle particle-three"></span>
    <span class="particle particle-four"></span>
    <span class="particle particle-five"></span>
    <span class="particle particle-six"></span>
    <span class="particle particle-seven"></span>
    <span class="particle particle-eight"></span>
    <span class="light-sweep"></span>
  </div>
  <main class="login-layout">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">BTV NEWS</div>
          <div class="brand-caption">NEWS NETWORKS</div>
        </div>
      </div>

      <div class="login-heading">
        <h1 id="loginTitle">EDITOR SIGN IN</h1>
        <p class="subtitle">Access the BTV video editing console.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="username">USERNAME</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field-group">
          <label for="password">PASSWORD</label>
          <div class="password-control">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
                <path class="eye-slash" d="M4 20 20 4"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="error-message" id="loginError" role="alert" aria-live="polite" hidden>Invalid username or password</p>
        <button class="login-button" type="submit">LOGIN</button>
      </form>

      <!-- <div class="panel-footer"><span class="live-dot"></span> BTV NEWS EDITOR</div> -->
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
